[package]
name = "power-monitor"
version = "0.2.0"
edition = "2021"
description = "Live laptop power TUI, styled after jcode. Event-driven, sleeps while hidden."
license = "MIT"

[dependencies]
crossterm = "0.29"
libc = "0.2"
ratatui = "0.30"
serde_json = "1"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
